<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>(경고) 절대 열어보지 말 것: 수상한 체험학습 가이드북</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 폰트 로드: Pretendard(본문), 티몬몬소리(제목/강조), 나눔펜스크립트(손글씨) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/TmonMonsori.woff" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --felt-green: #244223;
            --card-border: #1a202c; 
            --paper-bg: #fdfbf7;
        }

        @font-face {
            font-family: 'TmonMonsori';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/TmonMonsori.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--felt-green);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            color: #1a202c;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.5;
        }

        .board-card {
            background-color: var(--paper-bg);
            border: 4px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 6px 8px 0px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        
        .card-tilted-left { transform: rotate(-2deg); }
        .card-tilted-right { transform: rotate(1deg); }

        .btn-primary {
            background-color: #fbbf24;
            border: 3px solid var(--card-border);
            border-radius: 8px;
            box-shadow: 3px 5px 0px rgba(0, 0, 0, 0.4);
            font-weight: 700;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-primary:active, .btn-primary:disabled {
            transform: translate(3px, 5px);
            box-shadow: 0px 0px 0px rgba(0, 0, 0, 0);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .option-token {
            background-color: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.2);
            transition: all 0.2s;
            cursor: pointer;
        }
        .option-token.selected {
            background-color: #fbbf24;
            border-color: var(--card-border);
            box-shadow: inset 2px 3px 0px rgba(0,0,0,0.2);
            transform: translate(2px, 3px);
        }

        .letter-tile {
            background-color: #fef08a;
            border: 3px solid var(--card-border);
            border-radius: 6px;
            box-shadow: 2px 3px 0px rgba(0,0,0,0.3);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: bold;
            transition: all 0.1s;
            cursor: pointer;
        }
        .letter-tile.selected {
            background-color: #ef4444;
            color: white;
            transform: translate(2px, 3px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .font-title { font-family: 'TmonMonsori', sans-serif; }
        .font-hand { font-family: 'Nanum Pen Script', cursive; font-size: 1.7rem; letter-spacing: 0.5px; }

        .life-token {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #7f1d1d;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.4);
            display: inline-block;
            margin: 0 2px;
        }
        .life-token.empty {
            background: #d1d5db;
            box-shadow: inset 1px 2px 3px rgba(0,0,0,0.3);
            border-color: #9ca3af;
        }

        .modal-card {
            background-color: var(--paper-bg);
            border: 4px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 8px 12px 20px rgba(0,0,0,0.6);
            padding: 1.5rem;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 100 V 0 H 100' fill='none' stroke='%23e5e7eb' stroke-width='1'/%3E%3C/svg%3E");
            background-size: 20px 20px;
        }
        .modal-card.error { border-color: #dc2626; }

        .damage-flash { animation: damageFlash 0.4s; }
        @keyframes damageFlash {
            0% { background-color: #ef4444; }
            100% { background-color: var(--felt-green); }
        }

        @keyframes shakeReject {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10px, 5px) rotate(-5deg); }
            50% { transform: translate(10px, -5px) rotate(5deg); }
            75% { transform: translate(-10px, -5px) rotate(-5deg); }
        }
        .shake-reject { animation: shakeReject 0.4s ease-in-out; background-color: #fca5a5 !important; border-color: #b91c1c !important; }
        .packed-item { transform: scale(0); opacity: 0; pointer-events: none; transition: all 0.3s ease; }

        ::-webkit-scrollbar { display: none; }

        #app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .doc-slide-up { transform: translateY(-90px) rotate(-2deg); z-index: 25 !important; }
        .envelope-tear { animation: tearAway 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes tearAway {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            20% { transform: scale(1.05) translateY(10px) rotate(-2deg); }
            100% { transform: scale(1.5) translateY(-150px) rotate(5deg); opacity: 0; filter: blur(4px); }
        }
        
        .deal-animation { animation: dealCard 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; }
        @keyframes dealCard {
            0% { transform: translateY(-50px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .route-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        .route-animate { animation: drawRoute 2.5s ease-out forwards; }
        @keyframes drawRoute { to { stroke-dashoffset: 0; } }
        
        .map-dot { transform: scale(0); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dot-appear { transform: scale(1); }

        .flashlight-wrapper {
            position: relative;
            background-color: #27272a;
            overflow: hidden;
            touch-action: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }
        .flashlight-overlay {
            position: absolute;
            inset: 0;
            background-color: #171717;
            z-index: 10;
            pointer-events: none;
            --x: -100px;
            --y: -100px;
            mask-image: radial-gradient(circle 60px at var(--x) var(--y), transparent 0%, rgba(0,0,0,0.95) 100%);
            -webkit-mask-image: radial-gradient(circle 60px at var(--x) var(--y), transparent 0%, rgba(0,0,0,0.95) 100%);
        }
        .flashlight-text {
            position: absolute;
            inset: 0;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.15);
            line-height: 1.5;
            pointer-events: none;
        }
        .uv-ink {
            color: #bef264;
            text-shadow: 0 0 10px rgba(190, 242, 100, 0.8);
        }

        .envelope-image-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .envelope-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 상단 헤더 -->
        <header id="header" class="hidden mt-4 mx-4 mb-2 z-20 flex justify-between items-start">
            <div class="board-card py-2 px-3 flex flex-col min-w-[120px]">
                <span class="text-[0.65rem] font-bold text-gray-500">플레이어</span>
                <span class="text-sm font-black text-gray-800"><i class="fa-solid fa-user-secret mr-1"></i> <span id="display-team"></span></span>
            </div>
            <div class="flex flex-col items-end">
                <div class="board-card py-1 px-2 mb-1 flex items-center bg-gray-100">
                    <span class="text-[0.65rem] font-bold text-gray-500 mr-2">생존 칩</span>
                    <div id="chip-container" class="flex"></div>
                </div>
                <div class="board-card py-1 px-3 w-full text-center">
                    <span class="text-[0.65rem] font-bold text-gray-500 mr-1">해독률</span>
                    <span class="text-sm font-black text-blue-700" id="progress-percent">0%</span>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto pb-24 relative z-10"></main>

        <!-- 하단 단서 슬롯 -->
        <footer id="footer" class="hidden fixed bottom-4 w-full max-w-[480px] px-4 z-20">
            <div class="board-card p-2 flex justify-between items-center bg-[#f8fafc]">
                <span class="text-[0.7rem] font-bold text-gray-600">획득한 키워드:</span>
                <div class="flex gap-1" id="word-slots"></div>
            </div>
        </footer>

        <!-- 모달 (팝업창) -->
        <div id="modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4">
            <div id="modal-content" class="modal-card w-full max-w-sm relative transform rotate-1">
                <div class="absolute -top-4 -left-3 px-3 py-1 border-2 font-bold rounded shadow-sm text-sm" id="modal-tag">알림</div>
                <h3 id="modal-title" class="text-xl font-black mb-3 mt-2 flex items-center gap-2"></h3>
                <p id="modal-msg" class="text-sm font-medium mb-6 leading-relaxed text-gray-800 min-h-[60px]"></p>
                <div class="flex justify-end">
                    <button id="modal-btn" class="btn-primary px-6 py-2 text-sm bg-blue-500 text-white border-blue-900 shadow-[3px_4px_0_#1e3a8a] hover:bg-blue-600">확인</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ★★★ 여기에 복사해둔 구글 앱스 스크립트 웹앱 주소를 꼭 넣어주세요! ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHxZTFawHHnA3PR__GXFvdexF1PrwVK1UekiD1hvTiEXjH7dATmZupxQnE-J3mviC7/exec"; 

        const STATE = {
            teamName: "",
            studentInfo: "",
            studentPledge: "",
            chips: 5,
            zone: 0, 
            words: ["?", "?", "?", "?", "?", "?", "?", "?"], 
            progress: [0, 11, 22, 33, 44, 55, 66, 77, 88, 95, 100], 
            tempData: {} 
        };

        const elMain = document.getElementById('main-content');
        const elHeader = document.getElementById('header');
        const elFooter = document.getElementById('footer');
        const elModal = document.getElementById('modal');
        const elModalContent = document.getElementById('modal-content');

        window.updateFlashlight = (e) => {
            e.preventDefault(); 
            const wrapper = e.currentTarget;
            const rect = wrapper.getBoundingClientRect();
            let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
            
            const overlay = wrapper.querySelector('.flashlight-overlay');
            if(overlay) {
                overlay.style.setProperty('--x', `${clientX - rect.left}px`);
                overlay.style.setProperty('--y', `${clientY - rect.top}px`);
            }
        };

        window.resetFlashlight = (e) => {
            const wrapper = e.currentTarget;
            const overlay = wrapper.querySelector('.flashlight-overlay');
            if(overlay) {
                overlay.style.setProperty('--x', `-100px`);
                overlay.style.setProperty('--y', `-100px`);
            }
        };

        function typeWriter(elementId, text, speed = 30, callback = null) {
            const el = document.getElementById(elementId);
            if(!el) return;
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    if (text.charAt(i) === '<') {
                        let tag = '';
                        while (text.charAt(i) !== '>' && i < text.length) { tag += text.charAt(i); i++; }
                        tag += '>'; el.innerHTML += tag; i++;
                    } else {
                        el.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i); i++;
                    }
                    setTimeout(type, speed);
                } else if (callback) { callback(); }
            }
            type();
        }

        function showModal(title, msg, type = 'info', btnText = '다음으로', callback = null) {
            const isError = type === 'error';
            elModalContent.className = `modal-card w-full max-w-sm relative transform ${isError ? 'rotate-1 error' : '-rotate-1'}`;
            
            const tag = document.getElementById('modal-tag');
            tag.innerText = isError ? '경고' : '안내';
            tag.className = `absolute -top-4 -left-3 px-3 py-1 border-2 font-black rounded shadow-sm text-sm font-title tracking-widest ${isError ? 'bg-red-600 border-red-900 text-white' : 'bg-gray-800 border-gray-900 text-white'}`;
            
            const titleEl = document.getElementById('modal-title');
            titleEl.innerHTML = title;
            titleEl.className = `font-title text-2xl tracking-wide mb-2 mt-2 flex items-center gap-2 border-b-2 pb-2 ${isError ? 'text-red-700 border-red-200' : 'text-blue-800 border-blue-200'}`;
            
            document.getElementById('modal-msg').innerHTML = "";
            typeWriter('modal-msg', msg, 20);
            
            const btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.className = `btn-primary px-6 py-2 text-sm text-white shadow-[3px_4px_0_rgba(0,0,0,0.5)] ${isError ? 'bg-red-500 border-red-900 hover:bg-red-600' : 'bg-blue-500 border-blue-900 hover:bg-blue-600'}`;
            
            btn.onclick = () => {
                elModal.classList.add('opacity-0');
                setTimeout(() => {
                    elModal.classList.add('hidden');
                    if (callback) callback();
                }, 200);
            };

            elModal.classList.remove('hidden');
            setTimeout(() => elModal.classList.remove('opacity-0'), 10);
        }

        function takeDamage(customTitle = null, customMsg = null, callback = null) {
            if (STATE.chips > 0) {
                STATE.chips--;
                updateHeader();
                document.body.classList.add('damage-flash');
                setTimeout(() => document.body.classList.remove('damage-flash'), 400);
                
                if(STATE.chips === 0) {
                    showModal('<i class="fa-solid fa-skull"></i> 생존 칩 고갈', '안전 수칙 숙지가 미흡합니다.<br>하지만 교육을 위해 강제로 다음 단계로 넘어갑니다.', 'error', '다음으로', () => nextZone());
                } else {
                    showModal(customTitle || '<i class="fa-solid fa-triangle-exclamation"></i> 오답', customMsg || `수칙을 다시 한번 잘 생각해 보세요!<br><br>남은 생존 칩: [ ${STATE.chips} 개 ]`, 'error', '확인', callback);
                }
            } else {
                showModal('<i class="fa-solid fa-skull"></i> 치명적 오류', '더 이상 잃을 칩이 없습니다. 신중하게 선택하세요.', 'error', '확인', callback);
            }
        }

        function updateHeader() {
            document.getElementById('display-team').innerText = STATE.teamName;
            document.getElementById('progress-percent').innerText = `${STATE.progress[Math.min(STATE.zone, 10)]}%`;
            
            let chipsHtml = '';
            for(let i=0; i<5; i++) {
                chipsHtml += (i < STATE.chips) ? '<div class="life-token"></div>' : '<div class="life-token empty"></div>';
            }
            document.getElementById('chip-container').innerHTML = chipsHtml;

            let slotsHtml = '';
            for(let i=0; i<8; i++) {
                if(STATE.words[i] !== '?') {
                    slotsHtml += `<div class="w-7 h-7 bg-white border-2 border-gray-900 rounded font-black flex items-center justify-center text-sm shadow-[2px_2px_0_rgba(0,0,0,0.2)] font-title">${STATE.words[i]}</div>`;
                } else {
                    slotsHtml += `<div class="w-7 h-7 bg-gray-200 border-2 border-gray-400 rounded font-bold flex items-center justify-center text-gray-400 text-[0.6rem] border-dashed">?</div>`;
                }
            }
            document.getElementById('word-slots').innerHTML = slotsHtml;
        }

        function nextZone() {
            STATE.zone++;
            renderCurrentZone();
            updateHeader();
        }

        function createStoryBox(idSuffix, title, icon) {
            return `
                <div class="board-card mb-6 p-4 pt-8 card-tilted-left deal-animation bg-white" style="animation-delay: 0.1s">
                    <div class="absolute -top-3 left-4 bg-gray-800 text-white px-3 py-1 font-black rounded text-sm shadow-md border-2 border-gray-900 font-title tracking-wide">
                        <i class="${icon} mr-1 text-yellow-400"></i> ${title}
                    </div>
                    <div class="text-sm text-gray-700 font-medium leading-relaxed min-h-[60px]" id="story-text-${idSuffix}"></div>
                </div>
            `;
        }

        function renderZone0() {
            elHeader.classList.add('hidden');
            elFooter.classList.add('hidden');
            
            elMain.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[85vh] px-2 w-full max-w-[420px] mx-auto py-8">
                    <div id="envelope-container" class="relative w-[340px] h-[240px] mb-12 mt-4 perspective-[1000px] deal-animation mx-auto" style="animation-delay: 0.1s">
                        <div id="envelope-doc" class="absolute left-1/2 top-4 w-[280px] h-[190px] -translate-x-1/2 bg-[#fdfbf7] border-[3px] border-[#1a202c] z-10 flex flex-col items-center justify-center p-2 rounded shadow-xl transition-all duration-[1000ms] ease-out opacity-0">
                            <div class="absolute -top-3 -right-3 font-title text-red-600 border-[3px] border-red-600 bg-white text-[0.8rem] px-2 py-1 transform rotate-12 shadow-sm tracking-wider z-20">CONFIDENTIAL</div>
                            <h1 class="font-title text-[#b91c1c] text-4xl leading-tight mb-2 text-center tracking-wider mt-4">절대 열어보지 말 것</h1>
                            <div class="w-[90%] border-t-[3px] border-dashed border-gray-400 mb-2"></div>
                            <p class="text-[#1a202c] font-bold text-lg tracking-tight mt-1">수상한 체험학습 가이드북</p>
                        </div>
                        <div id="user-envelope-wrapper" class="absolute inset-0 z-20 transition-all duration-[800ms] ease-in-out envelope-image-container bg-transparent">
                            <img src="envelop.png" alt="비밀 봉투" onerror="this.src='https://placehold.co/340x240/d8ab76/1a202c?text=선생님의+봉투+이미지';">
                        </div>
                    </div>
                    
                    <div id="input-area" class="board-card w-full p-6 card-tilted-right deal-animation transition-opacity duration-300 relative z-40" style="animation-delay: 0.3s">
                        <label class="block text-sm font-black text-gray-700 mb-2 uppercase text-center"><i class="fa-solid fa-fingerprint mr-1"></i> 플레이어 등록 (Player Name)</label>
                        <input type="text" id="team-input" class="w-full bg-white border-2 border-gray-400 rounded-lg p-3 text-lg font-bold focus:outline-none focus:border-blue-500 mb-5 text-center placeholder-gray-300 shadow-inner" placeholder="닉네임(별명)을 적어주세요" autocomplete="off">
                        <button onclick="startMission()" class="btn-primary font-title w-full py-4 text-xl tracking-wider bg-red-600 border-red-900 shadow-[3px_5px_0px_rgba(127,29,29,0.8)] text-white hover:bg-red-700 relative overflow-hidden">봉투 뜯기</button>
                    </div>
                </div>
            `;
        }

        window.startMission = () => {
            const name = document.getElementById('team-input').value.trim();
            if(!name) { showModal('신원 미상', '플레이어의 닉네임을 입력하십시오.', 'error'); return; }
            STATE.teamName = name;

            const envelopeDoc = document.getElementById('envelope-doc');
            const userEnvelope = document.getElementById('user-envelope-wrapper');
            const envelopeContainer = document.getElementById('envelope-container');
            const inputArea = document.getElementById('input-area');

            if(inputArea) inputArea.style.opacity = '0';
            if(userEnvelope) {
                userEnvelope.style.transform = 'translateY(150px) rotate(15deg)';
                userEnvelope.style.opacity = '0';
            }
            
            setTimeout(() => { if(envelopeDoc) { envelopeDoc.classList.remove('opacity-0'); envelopeDoc.classList.add('doc-slide-up'); } }, 400);
            setTimeout(() => { if(envelopeContainer) envelopeContainer.classList.add('envelope-tear'); }, 2500);

            setTimeout(() => {
                elHeader.classList.remove('hidden');
                elFooter.classList.remove('hidden');
                updateHeader();
                nextZone();
            }, 3500);
        }

        function renderZone1() {
            STATE.tempData.packedCount = 0;
            const items = [

                    draggedEl.style.transition = 'none'; draggedEl.style.zIndex = '50';

                STATE.tempData.gameRunning = true; STATE.tempData.score = 0; document.getElementById('score-display').innerText = '0 / 3';
                dropId = setInterval(spawnItem, 1000); gameLoop();
            };
            function spawnItem() {
                if(!STATE.tempData.gameRunning) return;
                const container = document.getElementById('game-container');
                const isGood = Math.random() > 0.45;
                const goodList = [{emoji: '🧼', text: '손 씻기'}, {emoji: '💧', text: '깨끗한 물'}, {emoji: '😷', text: '마스크'}];
                const badList = [{emoji: '🦠', text: '더러운 손'}, {emoji: '🤧', text: '기침 튀기기'}, {emoji: '🍽️', text: '음식 공유'}];
                const data = isGood ? goodList[Math.floor(Math.random()*goodList.length)] : badList[Math.floor(Math.random()*badList.length)];
                
                const item = document.createElement('div'); item.className = 'absolute flex flex-col items-center justify-center pointer-events-none drop-item';
                item.innerHTML = `<span class="text-3xl filter drop-shadow-sm">${data.emoji}</span><span class="text-[0.65rem] font-black bg-white/90 px-1 mt-1 rounded border border-gray-300 text-gray-700 whitespace-nowrap shadow-sm">${data.text}</span>`;
                item.dataset.type = isGood ? 'good' : 'bad';
                item.style.left = `${15 + Math.random() * 70}%`; item.style.top = `-50px`; item.style.transform = `translateX(-50%)`;
                item.dataset.speed = 1.5 + Math.random() * 1.5; 
                container.appendChild(item); STATE.tempData.gameItems.push(item);
            }
            function gameLoop() {
                if(!STATE.tempData.gameRunning) return;
                const pRect = document.getElementById('game-player').getBoundingClientRect();
                const containerRect = document.getElementById('game-container').getBoundingClientRect();
                for(let i = STATE.tempData.gameItems.length - 1; i >= 0; i--) {
                    const item = STATE.tempData.gameItems[i];
                    let currentTop = parseFloat(item.style.top); currentTop += parseFloat(item.dataset.speed); item.style.top = `${currentTop}px`;
                    const iRect = item.getBoundingClientRect();
                    
                    if (iRect.left < pRect.right - 15 && iRect.right > pRect.left + 15 && iRect.top < pRect.bottom - 15 && iRect.bottom > pRect.top + 15) {
                        if(item.dataset.type === 'good') {
                            STATE.tempData.score++; document.getElementById('score-display').innerText = `${STATE.tempData.score} / 3`;
                            item.remove(); STATE.tempData.gameItems.splice(i, 1);
                            if(STATE.tempData.score >= 3) {
                                STATE.tempData.gameRunning = false; clearInterval(dropId);
                                STATE.words[6] = "사"; updateHeader();
                                showModal('<i class="fa-solid fa-shield-halved"></i> 위생 방어 성공', '일곱 번째 글자 <strong class="text-xl text-blue-700 font-title">[사]</strong> 획득 완료.', 'info', '다음 카드로', () => nextZone());
                            }

                            takeDamage('<i class="fa-solid fa-virus"></i> 감염 위험!', '나쁜 위생 습관을 획득했습니다! 다시 도전하세요.', () => {

                                document.getElementById('start-overlay').classList.remove('hidden'); document.getElementById('start-overlay').innerHTML = "다시 시작하기";
                            });
                        }
                    } else if (currentTop > containerRect.height) { item.remove(); STATE.tempData.gameItems.splice(i, 1); }
                }
                if(STATE.tempData.gameRunning) loopId = requestAnimationFrame(gameLoop);
            }
            window.movePlayer = (e) => {
                if(!STATE.tempData.gameRunning) return;
                const rect = document.getElementById('game-container').getBoundingClientRect();

                document.getElementById('game-player').style.left = `${Math.max(30, Math.min(rect.width - 30, x))}px`;

                        <div class="absolute -top-4 -right-4 text-[8rem] text-gray-800 opacity-20 font-black transform rotate-12 z-0"><i class="fa-solid fa-stamp"></i></div>
                        
                        <h2 class="font-title text-2xl text-gray-900 mb-4 border-b-4 border-gray-800 pb-2 relative z-10 tracking-wide">안전 교육 수료증</h2>
                        
                        <div class="relative z-10 mb-4 bg-white/90 p-3 rounded border border-gray-300 shadow-sm text-sm font-bold text-gray-800">
                            <div class="mb-1"><span class="text-gray-500 text-xs">소속/이름:</span> ${STATE.studentInfo}</div>
                            <div class="mb-1"><span class="text-gray-500 text-xs">닉네임:</span> ${STATE.teamName}</div>
                            <div class="italic text-blue-700 mt-2">"${STATE.studentPledge}"</div>
                        </div>
                        
                        <div class="bg-white/90 p-4 border-2 border-gray-400 rounded-lg relative z-10 shadow-sm text-center backdrop-blur-sm">
                            <p class="font-title text-sm text-gray-500 mb-2 tracking-wider">YOUR SURVIVAL RANK</p>
                            <div class="font-title text-6xl ${gradeColor} drop-shadow-md mb-2">${grade} <span class="text-3xl text-gray-800">등급</span></div>
                            <p class="text-sm font-bold text-gray-700">남은 생존 칩(하트): ${STATE.chips} / 5</p>
                        </div>
                    </div>

                    <div class="board-card w-full p-4 mb-8 bg-[#1a202c] border-gray-900 text-white z-10">
                        <h3 class="font-title text-xl text-yellow-400 mb-2 tracking-wide">총평: ${title}</h3>
                        <p class="text-sm text-gray-300 break-keep leading-relaxed">이 화면을 캡처하여 선생님께 제출해 주세요!</p>
                    </div>
                </div>
            `;
            elMain.innerHTML = html;
        }

        function renderCurrentZone() {
            switch(STATE.zone) {
                case 0: renderZone0(); break;
                case 1: renderZone1(); break;
                case 2: renderZone2(); break;
                case 3: renderZone3(); break;
                case 4: renderZone4(); break;
                case 5: renderZone5(); break;
                case 6: renderZone6(); break;
                case 7: renderZone7(); break;
                case 8: renderZone8(); break;
                case 9: renderZone9(); break;
                case 10: renderZone10(); break;
            }
        }
        renderCurrentZone();
    </script>
</body>
</html>
