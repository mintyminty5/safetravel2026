<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minty Lab</title>
<meta name="description" content="수업에서 실제로 굴려 본 웹앱과 연수 자료를 모아 둡니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEEE8;
  --ink:#1C221D; --ink-2:#6C7269; --ink-3:#9A9F96;
  --line:#E3E1D9; --line-2:#D3D1C7;
  --accent:#386A43; --accent-soft:#E6F2E8;
  --brand-petal:#E6F2E8; --brand-ink:#386A43;
  --shadow:0 1px 2px rgba(28,34,29,.05), 0 8px 24px rgba(28,34,29,.06);
  --shadow-lift:0 2px 6px rgba(28,34,29,.07), 0 18px 40px rgba(28,34,29,.12);
  --serif:"Gowun Batang",serif;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141714; --surface:#1C201C; --surface-2:#232823;
    --ink:#ECEFE9; --ink-2:#9DA398; --ink-3:#767C72;
    --line:#2B302B; --line-2:#3A403A;
    --accent:#82BC8E; --accent-soft:#212D22;
    --brand-petal:#DCEDE2; --brand-ink:#9FD4AB;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lift:0 2px 6px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:800px; margin:0 auto; padding:0 28px}
h1,h2,h3{margin:0; font-weight:700; text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}

.petal{width:44px; height:44px; display:block; flex-shrink:0}
.brand{display:flex; align-items:center; gap:13px}
.brand .bn{font-family:var(--serif); font-weight:700; font-size:24px; color:var(--brand-ink); line-height:1.15}
.brand .bt{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:3px}

header.hero{padding:72px 0 44px}
header.hero .intro{margin-top:34px; max-width:56ch}
header.hero h1{font-family:var(--serif); font-size:clamp(26px,4.2vw,36px); line-height:1.4; letter-spacing:-.02em}
header.hero h1 em{font-style:normal; color:var(--accent)}
header.hero p{color:var(--ink-2); margin-top:14px; font-size:16px}

section.items{padding:12px 0 8px; border-top:1px solid var(--line)}
.sechead{display:flex; align-items:baseline; gap:14px; padding:26px 0 18px}
.sechead h2{font-family:var(--serif); font-size:19px}
.sechead .n{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); letter-spacing:.08em}

.list{display:flex; flex-direction:column; gap:16px}
.item{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:22px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:18px 20px; text-decoration:none; box-shadow:var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s;
}
.item:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--line-2)}
.thumbs{display:grid; grid-template-columns:repeat(2,34px); grid-auto-rows:24px; gap:3px}
.thumbs img{width:100%; height:100%; object-fit:cover; border-radius:3px; display:block; background:var(--surface-2)}
.item .t .nm{font-size:17px; font-weight:600; letter-spacing:-.01em}
.item .t .de{color:var(--ink-2); font-size:14px; margin-top:3px}
.item .t .pa{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:7px; letter-spacing:.04em}
.item .go{font-size:20px; color:var(--accent); line-height:1}

.soon{
  border:1px dashed var(--line-2); border-radius:12px; padding:18px 20px;
  color:var(--ink-3); font-size:14px; display:flex; align-items:center; gap:12px;
}
.soon .dot{font-size:15px; opacity:.6}

footer{
  margin-top:56px; padding:24px 0 56px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap;
  font-size:13px; color:var(--ink-2);
}
footer .cr{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
footer a{color:var(--accent); text-decoration:none; border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
@media (max-width:600px){
  .item{grid-template-columns:auto 1fr; gap:16px}
  .item .go{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="brand">
      <svg class="petal" viewBox="-3 -3 106 106" aria-hidden="true">
        <g fill="var(--brand-petal)" stroke="var(--brand-ink)" stroke-width="3.5" vector-effect="non-scaling-stroke">
          <ellipse cx="50" cy="26" rx="16.5" ry="22"/>
          <ellipse cx="50" cy="26" rx="16.5" ry="22" transform="rotate(72 50 50)"/>
          <ellipse cx="50" cy="26" rx="16.5" ry="22" transform="rotate(144 50 50)"/>
          <ellipse cx="50" cy="26" rx="16.5" ry="22" transform="rotate(216 50 50)"/>
          <ellipse cx="50" cy="26" rx="16.5" ry="22" transform="rotate(288 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="10.5" fill="var(--brand-ink)"/>
      </svg>
      <div>
        <div class="bn">Minty.E</div>
        <div class="bt">made in Minty Lab</div>
      </div>
    </div>

    <div class="intro">
      <h1>교실에서 실제로 굴려 본 것만<br><em>여기에 둡니다.</em></h1>
      <p>수업용 웹앱과 연수 자료를 모아 두는 곳입니다. 필요하신 선생님은 자유롭게 가져다 쓰셔도 좋습니다.</p>
    </div>
  </header>

  <section class="items">
    <div class="sechead">
      <span class="eyebrow">Materials</span>
      <span class="n">01</span>
    </div>

    <div class="list">
      <a class="item" href="/style-atlas">
        <div class="thumbs">
          <img src="style-atlas/img/16-comic.jpg" alt="" width="1400" height="788" loading="lazy">
          <img src="style-atlas/img/12-night.jpg" alt="" width="1400" height="788" loading="lazy">
          <img src="style-atlas/img/14-newspaper.jpg" alt="" width="1400" height="788" loading="lazy">
          <img src="style-atlas/img/04-pastel.jpg" alt="" width="1400" height="788" loading="lazy">
        </div>
        <div class="t">
          <div class="nm">수업용 웹앱 스타일 도감</div>
          <div class="de">같은 앱을 16가지 얼굴로. 스타일 프롬프트와 실제 화면 예시를 짝지은 연수 자료</div>
          <div class="pa">/style-atlas</div>
        </div>
        <span class="go" aria-hidden="true">→</span>
      </a>

      <div class="soon">
        <span class="dot">◌</span>
        <span>다음 자료를 준비하고 있습니다.</span>
      </div>
    </div>
  </section>

  <footer>
    <span class="cr">Minty Lab</span>
    <span><a href="https://blog.naver.com/leezmagnificent" target="_blank" rel="noopener">민티쌤 블로그</a></span>
  </footer>

</div>
</body>
</html>
